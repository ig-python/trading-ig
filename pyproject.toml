[build-system]
requires = ["uv_build>=0.11.6,<0.13.0"]
build-backend = "uv_build"

[project]
name = "trading-ig"
version = "0.0.24"
description = "A lightweight Python wrapper for the IG Markets API"
authors = [
    { name = "Femto Trader", email = "femto.trader@gmail.com" },
    { name = "Andy Geach", email = "andy@bugorfeature.net" },
]
requires-python = ">=3.10,<4"
readme = "README.rst"
license = "BSD-3-Clause"
maintainers = [
    { name = "Andy Geach", email = "andy@bugorfeature.net" }
]
keywords = [
    "trading",
    "spread betting",
    "CFDs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.24,<3",
    "pycryptodome>=3.9,<4",
    "requests-cache>1,<2",
    "six>=1.15,<2",
    "lightstreamer-client-lib==1.0.3",
]

[project.optional-dependencies]
pandas = [
    "pandas>=2,<3",
]
munch = ["munch>=4,<5"]
tenacity = [
    "tenacity>=9,<10",
]

[project.urls]
Homepage = "https://github.com/ig-python/trading-ig"
Repository = "https://github.com/ig-python/trading-ig"
Documentation = "https://trading-ig.readthedocs.io/"
Issues = "https://github.com/ig-python/trading-ig/issues"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "responses>=0.25,<0.26",
    "coveralls>=3,<4",
    "sphinx",
    "sphinx-rtd-theme",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: Integration tests (requires API credentials)",
]

[tool.uv.build-backend]
module-name = "trading_ig"
module-root = ""

[tool.ruff.lint]
ignore = ["B017", "B023", "BLE001", "TRY002" ]
